name: log-aggregator

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - log-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logs -d logs']
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP: backend
    environment:
      DATABASE_URL: postgres://logs:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/logs
      PORT: 3001
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000},http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:8080/ && wget -q --spider http://127.0.0.1:8080/api/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        APP: generator
    environment:
      API_URL: http://backend:3001
      GENERATOR_INTERVAL_MS: ${GENERATOR_INTERVAL_MS:-650}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/generator-heartbeat','utf8'))<75000?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  log-data:
